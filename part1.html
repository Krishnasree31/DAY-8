
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .box {
            width: 300px;
            height: 150px;

            padding: 20px;
            background-color: lightblue;

            border: 5px solid green;

            margin: 30px;
            outline: 30px solid transparent;
        }

        .container {
            background-color: lightcoral;
            padding: 1px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            Example of CSS Box Model .
        </div>
    </div>

</body>
</html>
