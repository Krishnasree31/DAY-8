
<!DOCTYPE html>
<html>
<head>
    <title>CSS Margin Experiment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #d7d9dc;
        }

        h1 {
            text-align: center;
            color: rgb(22, 22, 23);
        }

        .box1 {
            background-color: lightblue;
            border: 3px solid blue;
            padding: 20px;
            margin: 20px;
        }

        .box2 {
            background-color: lightgreen;
            border: 3px solid green;
            padding: 20px;
            margin: 50px;
        }

        .box3 {
            background-color: lightpink;
            border: 3px solid red;
            padding: 20px;
            width: 300px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Margin Experiment</h1>

    <div class="box1">
        <h3>Box 1</h3>
        <p>Margin: 20px</p>
    </div>

    <div class="box2">
        <h3>Box 2</h3>
        <p>Margin: 50px</p>
    </div>

    <div class="box3">
        <h3>Box 3</h3>
        <p>Margin: auto (Centered)</p>
    </div>

</body>
</html>
