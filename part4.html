
<!DOCTYPE html>
<html>
<head>
    <title>CSS Border Experiment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
        }

        h1 {
            text-align: center;
            color: rgb(11, 11, 11);
        }

        .box1 {
            border-width: 2px;
            border-style: solid;
            border-color: rgb(69, 69, 165);
            padding: 20px;
            margin: 20px;
        }

        .box2 {
            border-width: 5px;
            border-style: dashed;
            border-color: green;
            padding: 20px;
            margin: 20px;
        }

        .box3 {
            border-width: 8px;
            border-style: dotted;
            border-color: red;
            padding: 20px;
            margin: 20px;
        }

        .box4 {
            border: 4px solid purple;
            border-radius: 20px;
            padding: 20px;
            margin: 20px;
           
        }

        .box5 {
            border: 5px double rgb(42, 26, 93);
            border-radius: 40px;
            padding: 20px;
            margin: 20px;
           
        }
    </style>
</head>

<body>

    <h1>CSS Border Experiment</h1>

    <div class="box1">
        <h3>Solid Border</h3>
        <p>Width: 2px | Color: Blue</p>
    </div>

    <div class="box2">
        <h3>Dashed Border</h3>
        <p>Width: 5px | Color: Green</p>
    </div>

    <div class="box3">
        <h3>Dotted Border</h3>
        <p>Width: 8px | Color: Red</p>
    </div>

    <div class="box4">
        <h3>Rounded Corners</h3>
        <p>Border radius: 20px</p>
    </div>

    <div class="box5">
        <h3>Double Border</h3>
        <p>Border radius: 40px</p>
    </div>

</body>
</html>
