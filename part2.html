
<!DOCTYPE html>
<html>
<head>
    <title>CSS Padding Experiment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #707274;
        }

        h1 {
            text-align: center;
            color: rgb(234, 234, 240);
        }

        .box1 {
            background-color: rgb(99, 185, 211);
            padding: 10px;
            margin: 20px;
            border: 2px solid blue;
        }

        .box2 {
            background-color: rgb(167, 165, 93);
            padding: 25px;
            margin: 20px;
            border: 2px solid rgb(86, 77, 16);
        }

        .box3 {
            background-color: rgb(159, 183, 122);
            padding: 50px;
            margin: 20px;
            border: 2px solid rgb(64, 99, 7);
        }
    </style>
</head>

<body>

    <h1>CSS Padding Experiment</h1>

    <div class="box1">
        Padding: 10px
        <p>This is a container with small padding.</p>
    </div>

    <div class="box2">
        Padding: 25px
        <p>This is a container with medium padding.</p>
    </div>

    <div class="box3">
        Padding: 50px
        <p>This is a container with large padding.</p>
    </div>

</body>
</html>
