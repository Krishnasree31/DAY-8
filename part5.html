
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Sizing Experiment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
        }

        h1 {
            text-align: center;
            color: rgb(22, 22, 24);
        }

        .box1 {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid rgb(10, 10, 11);
            margin: 30px;
            background-color: lightblue;
            box-sizing: content-box;
        }

        .box2 {
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid rgb(18, 19, 18);
            margin: 30px;
            background-color: lightgreen;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h1>CSS Box Sizing Experiment</h1>

    <div class="box1">
        <h3>Content Box</h3>
        <p>Width: 300px</p>
        <p>Height: 150px</p>
    </div>

    <div class="box2">
        <h3>Border Box</h3>
        <p>Width: 300px</p>
        <p>Height: 150px</p>
    </div>

</body>
</html>
